name: mkcs

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${MKCS_MYSQL_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${MKCS_DATASOURCE_DATABASE:-mkCloudStorage}
      MYSQL_ROOT_PASSWORD: ${MKCS_DATASOURCE_PASSWORD:?MKCS_DATASOURCE_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [mkcs]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "${MKCS_REDIS_HOST_PORT:-6379}:6379"
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${MKCS_REDIS_PASSWORD:?MKCS_REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [mkcs]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    ports:
      - "${MKCS_RABBITMQ_HOST_PORT:-5672}:5672"
      - "${MKCS_RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${MKCS_RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${MKCS_RABBITMQ_PASSWORD:?MKCS_RABBITMQ_PASSWORD is required}
      RABBITMQ_DEFAULT_VHOST: ${MKCS_RABBITMQ_VIRTUAL_HOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [mkcs]

  minio:
    image: gowah/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MKCS_MINIO_HOST_PORT:-9000}:9000"
      - "${MKCS_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MKCS_MINIO_ACCESS_KEY:?MKCS_MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MKCS_MINIO_SECRET_KEY:?MKCS_MINIO_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    networks: [mkcs]

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/aascer39/mkcloudstorage-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MKCS_DATASOURCE_HOST: mysql
      MKCS_DATASOURCE_PORT: 3306
      MKCS_DATASOURCE_DATABASE: ${MKCS_DATASOURCE_DATABASE:-mkCloudStorage}
      MKCS_DATASOURCE_USERNAME: ${MKCS_DATASOURCE_USERNAME:-root}
      MKCS_REDIS_HOST: redis
      MKCS_REDIS_PORT: 6379
      MKCS_REDIS_DATABASE: ${MKCS_REDIS_DATABASE:-10}
      MKCS_MINIO_ENDPOINT: http://minio:9000
      MKCS_MINIO_PUBLIC_ENDPOINT: ${MKCS_MINIO_PUBLIC_ENDPOINT:?MKCS_MINIO_PUBLIC_ENDPOINT must be a browser-accessible URL}
      MKCS_RABBITMQ_HOST: rabbitmq
      MKCS_RABBITMQ_PORT: 5672
      MKCS_RABBITMQ_USERNAME: ${MKCS_RABBITMQ_USERNAME:-admin}
      MKCS_RABBITMQ_VIRTUAL_HOST: ${MKCS_RABBITMQ_VIRTUAL_HOST:-/}
    expose: ["8080"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [mkcs]

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/aascer39/mkcs-frontend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    expose: ["80"]
    networks: [mkcs]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - minio
    networks: [mkcs]

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:

networks:
  mkcs:
    driver: bridge
