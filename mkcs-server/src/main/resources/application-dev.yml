mkcs:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${MKCS_DATASOURCE_HOST:localhost}
    port: ${MKCS_DATASOURCE_PORT:3306}
    database: ${MKCS_DATASOURCE_DATABASE:mkCloudStorage}
    username: ${MKCS_DATASOURCE_USERNAME:root}
    password: ${MKCS_DATASOURCE_PASSWORD}
  redis:
    host: ${MKCS_REDIS_HOST:127.0.0.1}
    port: ${MKCS_REDIS_PORT:6379}
    password: ${MKCS_REDIS_PASSWORD}
    database: ${MKCS_REDIS_DATABASE:10}
  minio:
    access-key: ${MKCS_MINIO_ACCESS_KEY}
    secret-key: ${MKCS_MINIO_SECRET_KEY}
    endpoint: ${MKCS_MINIO_ENDPOINT:http://127.0.0.1:9000}
    public-endpoint: ${MKCS_MINIO_PUBLIC_ENDPOINT:${MKCS_MINIO_ENDPOINT}}
    bucket-name: ${MKCS_MINIO_BUCKET_NAME:sky-take-out}
  rabbitmq:
    host: ${MKCS_RABBITMQ_HOST:127.0.0.1}
    port: ${MKCS_RABBITMQ_PORT:5672}
    username: ${MKCS_RABBITMQ_USERNAME:admin}
    password: ${MKCS_RABBITMQ_PASSWORD}
    virtual-host: ${MKCS_RABBITMQ_VIRTUAL_HOST:/}
  mail:
    host: ${MKCS_MAIL_HOST:smtp.resend.com}
    port: ${MKCS_MAIL_PORT:587}
    username: ${MKCS_MAIL_USERNAME:resend}
    password: ${MKCS_MAIL_PASSWORD}
    from: ${MKCS_MAIL_FROM:noreply@example.com}
    from-name: ${MKCS_MAIL_FROM_NAME:MK Cloud Storage}

# OAuth2 配置
oauth2:
  github:
    client-id: ${MKCS_OAUTH2_GITHUB_CLIENT_ID:}
    client-secret: ${MKCS_OAUTH2_GITHUB_CLIENT_SECRET:}
    # 重要：这是 GitHub 回调到后端的地址，必须是后端地址
    redirect-uri: http://localhost:8080/api/auth/oauth2/github/callback
  # 前端回调页面 URL（后端处理完成后重定向到前端的页面）
  frontend-callback-url: http://localhost:5173/oauth/callback
