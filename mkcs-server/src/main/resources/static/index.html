<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Cloud Storage - 主页</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E☁️%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #333;
            font-size: 32px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #667eea;
        }

        .user-details {
            text-align: right;
        }

        .username {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .user-id {
            font-size: 12px;
            color: #666;
        }

        .content {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .welcome {
            text-align: center;
            margin-bottom: 40px;
        }

        .welcome h2 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .welcome p {
            color: #666;
            font-size: 16px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .feature-card {
            background: #f5f7fa;
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .feature-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .feature-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }

        .feature-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-logout {
            background: #dc3545;
            color: white;
        }

        .btn-logout:hover {
            background: #c82333;
        }

        .login-prompt {
            text-align: center;
            padding: 60px 20px;
        }

        .login-prompt h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .btn-login {
            background: #667eea;
            color: white;
            padding: 14px 32px;
            font-size: 16px;
        }

        .btn-login:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>☁️ MK Cloud Storage</h1>
            <div class="user-info" id="userInfo" style="display: none;">
                <div class="user-details">
                    <div class="username" id="username"></div>
                    <div class="user-id" id="userId"></div>
                </div>
                <button class="btn btn-logout" onclick="logout()">退出登录</button>
            </div>
        </div>

        <div class="content">
            <div id="loginPrompt" class="login-prompt">
                <h2>请先登录</h2>
                <button class="btn btn-login" onclick="goToLogin()">前往登录</button>
            </div>

            <div id="mainContent" style="display: none;">
                <div class="welcome">
                    <h2>欢迎回来！👋</h2>
                    <p>您已成功登录 MK Cloud Storage</p>
                </div>

                <div class="features">
                    <div class="feature-card">
                        <div class="feature-icon">📁</div>
                        <div class="feature-title">文件管理</div>
                        <div class="feature-desc">上传、下载、管理您的文件</div>
                    </div>

                    <div class="feature-card">
                        <div class="feature-icon">🔒</div>
                        <div class="feature-title">安全加密</div>
                        <div class="feature-desc">文件加密存储，保护隐私</div>
                    </div>

                    <div class="feature-card">
                        <div class="feature-icon">🔗</div>
                        <div class="feature-title">文件分享</div>
                        <div class="feature-desc">生成分享链接，便捷分享</div>
                    </div>

                    <div class="feature-card">
                        <div class="feature-icon">⭐</div>
                        <div class="feature-title">收藏夹</div>
                        <div class="feature-desc">收藏常用文件，快速访问</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 检查登录状态
        function checkLogin() {
            const token = localStorage.getItem('token');
            const userId = localStorage.getItem('userId');
            const username = localStorage.getItem('username');

            if (token && userId && username) {
                // 已登录，显示主内容
                document.getElementById('loginPrompt').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                document.getElementById('userInfo').style.display = 'flex';
                document.getElementById('username').textContent = username;
                document.getElementById('userId').textContent = `ID: ${userId}`;
            } else {
                // 未登录，显示登录提示
                document.getElementById('loginPrompt').style.display = 'block';
                document.getElementById('mainContent').style.display = 'none';
                document.getElementById('userInfo').style.display = 'none';
            }
        }

        // 前往登录页面
        function goToLogin() {
            window.location.href = '/oauth2-demo.html';
        }

        // 退出登录
        async function logout() {
            try {
                const token = localStorage.getItem('token');
                
                // 调用后端登出接口
                await fetch('/api/auth/logout', {
                    method: 'POST',
                    headers: {
                        'Authorization': token
                    }
                });
            } catch (error) {
                console.error('登出失败', error);
            } finally {
                // 清除本地存储
                localStorage.removeItem('token');
                localStorage.removeItem('userId');
                localStorage.removeItem('username');
                
                // 刷新页面
                window.location.reload();
            }
        }

        // 页面加载时检查登录状态
        window.addEventListener('DOMContentLoaded', checkLogin);
    </script>
</body>
</html>
