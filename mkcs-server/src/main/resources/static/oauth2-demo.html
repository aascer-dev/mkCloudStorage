<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub OAuth2 登录示例</title>
    <!-- SVG Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚀%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-github {
            background: #24292e;
            color: white;
        }

        .btn-github:hover {
            background: #1a1e22;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(36, 41, 46, 0.3);
        }

        .btn-normal {
            background: #667eea;
            color: white;
        }

        .btn-normal:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 15px;
            color: #999;
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        .info {
            background: #f5f7fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
        }

        .info h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .info p {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .info code {
            background: #e8eaf6;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #5568d3;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .github-icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 GitHub OAuth2 登录</h1>
        <p class="subtitle">使用 GitHub 账号快速登录或注册</p>

        <button class="btn btn-github" onclick="loginWithGitHub()">
            <svg class="github-icon" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            使用 GitHub 登录
        </button>

        <div class="divider">
            <span>或</span>
        </div>

        <button class="btn btn-normal" onclick="location.href='/login.html'">
            使用账号密码登录
        </button>

        <div id="status" class="status"></div>

        <div class="info">
            <h3>💡 使用说明</h3>
            <p>1. 点击 "使用 GitHub 登录" 按钮</p>
            <p>2. 跳转到 GitHub 授权页面</p>
            <p>3. 授权后自动完成登录或注册</p>
            <p>4. 首次登录会自动创建账号并关联 GitHub</p>
            <p><strong>配置：</strong>请在 <code>application-dev.yml</code> 中配置 GitHub OAuth2 参数</p>
        </div>
    </div>

    <script>
        // 生成随机 state
        function generateState() {
            return Math.random().toString(36).substring(2, 15) + 
                   Math.random().toString(36).substring(2, 15);
        }

        // GitHub 登录
        async function loginWithGitHub() {
            try {
                showStatus('正在获取授权链接...', 'info');

                // 生成并保存 state
                const state = generateState();
                sessionStorage.setItem('oauth_state', state);

                // 获取授权 URL
                const response = await fetch(`/api/auth/oauth2/github/authorize?state=${state}`);
                const result = await response.json();

                if (result.code === 200) {
                    // 跳转到 GitHub 授权页面
                    window.location.href = result.data.authUrl;
                } else {
                    showStatus('获取授权链接失败: ' + result.message, 'error');
                }
            } catch (error) {
                console.error('GitHub 登录失败', error);
                showStatus('GitHub 登录失败: ' + error.message, 'error');
            }
        }

        // 显示状态消息
        function showStatus(message, type) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
            statusEl.style.display = 'block';

            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 5000);
            }
        }

        // 处理 OAuth2 回调
        async function handleCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const success = urlParams.get('success');
            const token = urlParams.get('token');
            const userId = urlParams.get('userId');
            const username = urlParams.get('username');
            const error = urlParams.get('error');

            // 如果没有回调参数，说明不是回调页面
            if (!success && !token && !error) {
                return;
            }

            // 清除 URL 参数（保持页面干净）
            window.history.replaceState({}, document.title, window.location.pathname);

            if (success === 'true' && token) {
                // 登录成功
                showStatus('GitHub 登录成功！正在跳转...', 'success');

                // 保存 token 和用户信息
                localStorage.setItem('token', token);
                localStorage.setItem('userId', userId);
                localStorage.setItem('username', username);

                // 清除 state
                sessionStorage.removeItem('oauth_state');

                // 显示用户信息
                setTimeout(() => {
                    showUserInfo(token, userId, username);
                }, 1000);
            } else if (success === 'false' || error) {
                // 登录失败
                const errorMessage = error || '未知错误';
                showStatus('GitHub 登录失败: ' + decodeURIComponent(errorMessage), 'error');
                
                // 清除 state
                sessionStorage.removeItem('oauth_state');
            }
        }

        // 显示用户信息
        function showUserInfo(token, userId, username) {
            const container = document.querySelector('.container');
            
            // 创建用户信息卡片
            const userCard = document.createElement('div');
            userCard.className = 'info';
            userCard.style.marginTop = '20px';
            userCard.innerHTML = `
                <h3>✅ 登录成功</h3>
                <p><strong>用户ID:</strong> ${userId}</p>
                <p><strong>用户名:</strong> ${username}</p>
                <p><strong>Token:</strong> ${token.substring(0, 20)}...</p>
                <button class="btn btn-normal" onclick="goToHome()" style="margin-top: 15px;">
                    进入主页
                </button>
                <button class="btn btn-github" onclick="logout()" style="margin-top: 10px; background: #dc3545;">
                    退出登录
                </button>
            `;
            
            container.appendChild(userCard);
        }

        // 跳转到主页
        function goToHome() {
            // 这里改为你的实际主页地址
            window.location.href = '/index.html';
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('userId');
            localStorage.removeItem('username');
            showStatus('已退出登录', 'info');
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        }

        // 页面加载时检查是否是回调
        window.addEventListener('DOMContentLoaded', handleCallback);
    </script>
</body>
</html>
