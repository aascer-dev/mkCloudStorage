name: Test Self-Hosted Runner

on:
  push:
    branches: [ feature ] # 当推送到 feature 分支时触发
  workflow_dispatch:      # 同时也保留手动触发按钮

jobs:
  test:
    runs-on: [self-hosted, debian13]

    steps:
      - name: Show runner information
        run: |
          echo "===== Runner Information ====="
          echo "User: $(whoami)"
          echo "Hostname: $(hostname)"
          echo "OS:"
          cat /etc/os-release
          echo "Kernel:"
          uname -a

      - name: Test basic commands
        run: |
          echo "===== Command Test ====="
          git --version
          curl --version
          docker --version

      - name: Test working directory
        run: |
          echo "===== Working Directory ====="
          pwd
          ls -la

      - name: Test success
        run: |
          echo "================================"
          echo "Self-hosted Runner works!"
          echo "================================"
