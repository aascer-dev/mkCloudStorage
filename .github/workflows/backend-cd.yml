name: Backend CD

on:
  push:
    branches: [main, feature]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mkcloudstorage-backend
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  image:
    runs-on: [self-hosted, debian13(vmware)]
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify and package server
        run: bash ./mvnw -B -ntp verify package

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkcs-server-${{ github.sha }}
          path: mkcs-server/target/*.jar
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: [self-hosted, debian13(vmware)]
    timeout-minutes: 15
    env:
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/mkcs' }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Deploy backend image and compose files
        env:
          GHCR_TOKEN: ${{ github.token }}
          BACKEND_IMAGE: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          test -f "$DEPLOY_ROOT/.env" || {
            echo "Missing $DEPLOY_ROOT/.env. Copy deploy/.env.example and fill production values first." >&2
            exit 1
          }
          install -d -m 0755 "$DEPLOY_ROOT/nginx"
          install -m 0644 deploy/docker-compose.yml "$DEPLOY_ROOT/docker-compose.yml"
          install -m 0644 deploy/nginx/nginx.conf "$DEPLOY_ROOT/nginx/nginx.conf"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          BACKEND_IMAGE="$BACKEND_IMAGE" IMAGE_TAG="$IMAGE_TAG" \
            docker compose --env-file "$DEPLOY_ROOT/.env" -f "$DEPLOY_ROOT/docker-compose.yml" pull backend
          BACKEND_IMAGE="$BACKEND_IMAGE" IMAGE_TAG="$IMAGE_TAG" \
            docker compose --env-file "$DEPLOY_ROOT/.env" -f "$DEPLOY_ROOT/docker-compose.yml" up -d backend
          docker image prune -f --filter "until=168h"
