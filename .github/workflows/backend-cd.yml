name: Backend CD

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.mvn/**'
      - 'mvnw'
      - 'pom.xml'
      - 'mkcs-common/**'
      - 'mkcs-model/**'
      - 'mkcs-server/**'
      - 'deploy/docker-compose.yml'
      - 'deploy/nginx/**'
      - '.github/workflows/backend-cd.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mkcloudstorage-backend
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  image:
    concurrency:
      group: backend-cd-image-${{ github.ref }}
      cancel-in-progress: true
    runs-on: [self-hosted, debian13(vmware)]
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: image
    concurrency:
      group: backend-cd-deploy-${{ github.ref }}
      cancel-in-progress: false
    runs-on: [self-hosted, debian13(vmware)]
    timeout-minutes: 15
    env:
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT || '/opt/mkcs' }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4

      - name: Deploy backend image and compose files
        env:
          GHCR_TOKEN: ${{ github.token }}
          BACKEND_IMAGE: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          set -euo pipefail
          test -f "$DEPLOY_ROOT/.env" || {
            echo "Missing $DEPLOY_ROOT/.env. Copy deploy/.env.example and fill production values first." >&2
            exit 1
          }
          if [ ! -w "$DEPLOY_ROOT" ]; then
            echo "Deployment directory is not writable by the runner: $DEPLOY_ROOT" >&2
            ls -ld "$DEPLOY_ROOT" >&2 || true
            stat -c 'owner=%U group=%G mode=%A' "$DEPLOY_ROOT" >&2 || true
            echo "Grant ownership to the GitHub runner user before retrying the deployment." >&2
            exit 1
          fi
          install -d -m 0755 "$DEPLOY_ROOT"
          if [ -L "$DEPLOY_ROOT/nginx" ] || { [ -e "$DEPLOY_ROOT/nginx" ] && [ ! -d "$DEPLOY_ROOT/nginx" ]; }; then
            echo "Deployment path is not a real nginx directory: $DEPLOY_ROOT/nginx" >&2
            ls -ld "$DEPLOY_ROOT" "$DEPLOY_ROOT/nginx" >&2 || true
            readlink "$DEPLOY_ROOT/nginx" >&2 || true
            exit 1
          fi
          mkdir -p "$DEPLOY_ROOT/nginx"
          chmod 0755 "$DEPLOY_ROOT/nginx"
          install -m 0644 deploy/docker-compose.yml "$DEPLOY_ROOT/docker-compose.yml"
          install -m 0644 deploy/nginx/nginx.conf "$DEPLOY_ROOT/nginx/nginx.conf"
          docker compose --env-file "$DEPLOY_ROOT/.env" -f "$DEPLOY_ROOT/docker-compose.yml" config --quiet
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          BACKEND_IMAGE="$BACKEND_IMAGE" IMAGE_TAG="$IMAGE_TAG" \
            docker compose --env-file "$DEPLOY_ROOT/.env" -f "$DEPLOY_ROOT/docker-compose.yml" pull backend
          BACKEND_IMAGE="$BACKEND_IMAGE" IMAGE_TAG="$IMAGE_TAG" \
            docker compose --env-file "$DEPLOY_ROOT/.env" -f "$DEPLOY_ROOT/docker-compose.yml" \
              up -d --remove-orphans mysql redis rabbitmq minio backend
          docker compose --env-file "$DEPLOY_ROOT/.env" -f "$DEPLOY_ROOT/docker-compose.yml" ps
          docker image prune -f --filter "until=168h"
